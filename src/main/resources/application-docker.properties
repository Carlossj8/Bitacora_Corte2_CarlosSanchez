spring.application.name=la-brasa-viva

# Persistencia Relacional PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:restaurante}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Persistencia NoSQL MongoDB en Docker
spring.data.mongodb.uri=mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:admin}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DB:restaurante}?authSource=admin
spring.data.mongodb.auto-index-creation=true

# Seguridad & JWT
jwt.secret=${JWT_SECRET:TXkgc3VwZXIgc2VjcmV0IGtleSBwYXJhIGVsIHJlc3RhdXJhbnRlIGxhIGJyYXNhIHZpdmE=}
jwt.expiration-ms=3600000
