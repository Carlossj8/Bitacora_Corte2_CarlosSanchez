# .github/workflows/ci-prod.yml
name: CD — Deploy PROD

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/restaurante-api

jobs:

  build-prod:
    name: 🐳 Build imagen PROD
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata con el tag de versión
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build y push imagen de producción
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy-prod:
    name: 🚀 Desplegar a PROD
    needs: build-prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en Azure Web App (PROD)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'restaurante-qa-carlossj'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ needs.build-prod.outputs.version }}

  notify:
    name: 📣 Notificación
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Resumen del despliegue
        run: |
          echo "PROD desplegado exitosamente"
          echo "Version: ${{ github.ref_name }}"
          echo "URL: https://restaurante-qa-carlossj.azurewebsites.net"
